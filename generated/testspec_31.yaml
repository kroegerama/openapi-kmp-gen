openapi: 3.1.4
info:
  title: Test API
  description: Test API Description
  version: 1.0.0-SNAPSHOT

servers:
  - url: https://jsonplaceholder.typicode.com
    description: JSON Example API
  - url: https://example.com
    description: Example API
  - url: https://mock.httpstatus.io
    description: HTTP Status API

paths:
  /refTest:
    post:
      operationId: refTest
      parameters:
        - $ref: '#/components/parameters/TestParam'
      requestBody:
        $ref: '#/components/requestBodies/TestRequestBody'
      responses:
        200:
          $ref: '#/components/responses/TestResponse'
  /{status}:
    servers:
      - url: https://mock.httpstatus.io
    parameters:
      - in: path
        name: status
        required: true
        schema:
          type: string
      - in: query
        name: count
        schema:
          type: integer
          format: int32
    get:
      operationId: redirectTest
      responses:
        200:
          description: OK
  /photos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
    get:
      operationId: getPhoto
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
  /serialTest:
    get:
      operationId: getSerialTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerialTest'
  /integerTest:
    get:
      operationId: getIntegerTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegerTest'
  /numberTest:
    get:
      operationId: getNumberTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberTest'
  /defaultValue:
    get:
      operationId: defaultValue
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValue'
  /nullableResponse:
    get:
      operationId: nullableResponse
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - type: object
                    properties:
                      payload:
                        type: string
  /rawResponse:
    get:
      operationId: rawResponse
      responses:
        200:
          description: media type without schema -> raw response, not null
          content:
            application/octet-stream: { }
  /nullableBinaryResponse:
    get:
      operationId: nullableBinaryResponse
      responses:
        200:
          description: nullable non-json schema -> raw response, not null
          content:
            application/octet-stream:
              schema:
                type: [ string, "null" ]
  /nullableBody:
    post:
      operationId: nullableBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: "null"
                - $ref: '#/components/schemas/Photo'
      responses:
        204:
          description: required body with null type variant -> nullable body parameter
  /listBody:
    post:
      operationId: listBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        200:
          description: OK
  /mapBody:
    post:
      operationId: mapBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
      responses:
        200:
          description: OK
  /multipart:
    servers:
      - url: https://example.com
    post:
      operationId: multipart
      security:
        - BasicAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        200:
          description: OK
  /urlencoded:
    servers:
      - url: https://example.com
    post:
      operationId: urlEncoded
      security:
        - BearerAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        200:
          description: OK
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
    APIKeyAuth:
      type: apiKey
      in: query
      name: token
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    TestParam:
      name: testParam
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/DateTime'
  requestBodies:
    TestRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
  responses:
    TestResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Photo'
  schemas:
    DateTime:
      type: string
      format: date-time
    NullableAttrTest:
      required: [ attr1, attr2, attr4, attr5, attr6, attr7, attr8, attr9, attr10, attr11, attr12 ]
      properties:
        attr1:
          $ref: '#/components/schemas/Photo'
          description: required -> not null
        attr2:
          allOf:
            - $ref: '#/components/schemas/Photo'
          description: required allOf -> not null
        attr3:
          anyOf:
            - $ref: '#/components/schemas/Photo'
            - type: "null"
          description: has null type -> nullable
        attr4:
          oneOf:
            - type: "null"
            - description: required oneOf with null type -> nullable
              $ref: '#/components/schemas/Photo'
        attr5:
          oneOf:
            - type: "null"
            - type: string
          description: required oneOf with null type and primitive -> nullable String
        attr6:
          oneOf:
            - type: "null"
            - type: object
              properties:
                innerAttr:
                  type: string
          description: required oneOf with null type and inline object -> nullable generated class
        attr7:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: '#/components/schemas/Photo'
          description: required oneOf with null type around single allOf -> nullable
        attr8:
          type: [ string, "null" ]
          description: required with null in type list -> nullable
        attr9:
          type: array
          items:
            oneOf:
              - type: "null"
              - $ref: '#/components/schemas/Photo'
          description: required array with nullable items via oneOf
        attr10:
          $ref: '#/components/schemas/NullableInlineObject'
          description: required ref to intrinsically nullable named schema -> nullable
        attr11:
          $ref: '#/components/schemas/NullableExtendedPhoto'
          description: required ref to nullable schema with merged properties -> nullable
        attr12:
          oneOf:
            - type: "null"
            - description: deprecated oneOf variant -> deprecated nullable property
              deprecated: true
              $ref: '#/components/schemas/Photo'
    NullableExtendedPhoto:
      oneOf:
        - type: "null"
        - $ref: '#/components/schemas/Photo'
      properties:
        siblingAttr:
          type: string
      description: oneOf with null type and sibling properties -> object with merged properties
    MergedRequiredTest:
      oneOf:
        - type: "null"
        - type: object
          required: [ innerRequired ]
          properties:
            innerRequired:
              type: string
      properties:
        outerAttr:
          type: string
      description: variant required list is merged -> innerRequired stays non-null
    NullableInlineObject:
      oneOf:
        - type: "null"
        - type: object
          properties:
            value:
              type: string
      description: named oneOf with null type and inline object -> class, nullable at reference sites
    NullableRefTypealias:
      $ref: '#/components/schemas/NullableInlineObject'
      description: ref to intrinsically nullable named schema -> nullable typealias
    MergedNullableMember:
      allOf:
        - $ref: '#/components/schemas/Photo'
        - oneOf:
            - type: "null"
            - type: object
              properties:
                mergedAttr:
                  type: string
      description: allOf member wrapped in oneOf with null type -> object with merged properties
    NullableTestAnyOfTypealias:
      anyOf:
        - $ref: "#/components/schemas/Photo"
        - type: "null"
      description: Nullable Photo via anyOf
    NullableTestOneOfTypealias:
      oneOf:
        - $ref: "#/components/schemas/Photo"
        - type: "null"
      description: Nullable Photo via oneOf
    CombinedAnyOf:
      anyOf:
        - $ref: '#/components/schemas/Photo'
        - type: object
          properties:
            combinedExtraAttr:
              type: string
      description: anyOf without null type -> object with merged properties
    ExtendedPhoto:
      allOf:
        - $ref: '#/components/schemas/Photo'
      properties:
        extendedAttr:
          type: string
        title:
          description: annotation-only sibling redeclaration -> inherited type is kept
      description: single allOf with sibling properties -> object with merged properties
    NullableUnion:
      oneOf:
        - type: "null"
        - $ref: '#/components/schemas/NullableUnionChildA'
        - $ref: '#/components/schemas/NullableUnionChildB'
      discriminator:
        propertyName: kind
        mapping:
          a: '#/components/schemas/NullableUnionChildA'
          b: '#/components/schemas/NullableUnionChildB'
      description: oneOf with null type and multiple variants -> sealed interface without extra null child
    NullableUnionChildA:
      type: object
      properties:
        kind:
          type: string
        aValue:
          type: string
    NullableUnionChildB:
      type: object
      properties:
        kind:
          type: string
        bValue:
          type: integer
          format: int32
    DeprecatedUnion:
      deprecated: true
      oneOf:
        - $ref: '#/components/schemas/DeprecatedUnionChildA'
        - $ref: '#/components/schemas/DeprecatedUnionChildB'
      discriminator:
        propertyName: kind
      description: deprecated oneOf -> deprecated sealed interface
    DeprecatedUnionChildA:
      type: object
      properties:
        kind:
          type: string
        aValue:
          type: string
    DeprecatedUnionChildB:
      type: object
      properties:
        kind:
          type: string
        bValue:
          type: string
    RefTypealias:
      $ref: "#/components/schemas/Photo"
    Photo:
      type: object
      properties:
        albumId:
          type: integer
          format: int32
        id:
          type: integer
          format: int32
        title:
          type: string
        url:
          type: string
        thumbnailUrl:
          type: string
    SerialTest:
      type: object
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        instant:
          type: string
          format: date-time
        duration:
          type: string
          format: duration
        uuid:
          type: string
          format: uuid
        base64:
          type: string
          format: byte
        epochSeconds:
          type: integer
          format: epoch-seconds
        epochMillis:
          type: integer
          format: epoch-millis
    IntegerTest:
      type: object
      properties:
        unknown:
          type: integer
        int32:
          type: integer
          format: int32
        int64:
          type: integer
          format: int64
        float:
          type: integer
          format: float
        double:
          type: integer
          format: double
    NumberTest:
      type: object
      properties:
        unknown:
          type: number
        float:
          type: number
          format: float
        double:
          type: number
          format: double
        int32:
          type: number
          format: int32
        int64:
          type: number
          format: int64
    DefaultValue:
      type: object
      required:
        - requiredList
        - requiredMap
      properties:
        nullableString:
          type: string
        nullableList:
          type: array
          items:
            type: string
        requiredList:
          type: array
          items:
            type: string
        requiredMap:
          type: object
          additionalProperties:
            type: string
    SealedClassType:
      type: string
      enum:
        - C1
        - C2
    SealedClass1:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass1Child1'
        - $ref: '#/components/schemas/SealedClass1Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass1Child1'
          C2: '#/components/schemas/SealedClass1Child2'
    SealedClass1Child1:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child1Only:
              type: integer
    SealedClass1Child2:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child2Only:
              type: string
    SealedClass2:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass2Child1'
        - $ref: '#/components/schemas/SealedClass2Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass2Child1'
          C2: '#/components/schemas/SealedClass2Child2'
    SealedClass2Child1:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child1Only:
          type: integer
    SealedClass2Child2:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child2Only:
          type: string
    ActionResponse:
      type: object
      required:
        - kind
      anyOf:
        - $ref: '#/components/schemas/CreateActionResponse'
        - $ref: '#/components/schemas/UpdateActionResponse'
        - $ref: '#/components/schemas/DeleteActionResponse'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateActionResponse'
          update: '#/components/schemas/UpdateActionResponse'
          delete: '#/components/schemas/DeleteActionResponse'
    CreateActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - create
          type: string
        itemId:
          type: string
    UpdateActionResponse:
      required:
        - kind
        - oldItemId
        - newItemId
      properties:
        kind:
          enum:
            - update
          type: string
        oldItemId:
          type: string
        newItemId:
          type: string
    DeleteActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - delete
          type: string
        itemId:
          type: string
    # variants of EventNotification, deliberately declared before their sealed wrapper:
    # the discriminator property must be stripped regardless of declaration order
    CreateEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - create
          type: string
        eventId:
          type: string
    DeleteEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - delete
          type: string
        eventId:
          type: string
    EventNotification:
      anyOf:
        - $ref: '#/components/schemas/CreateEventNotification'
        - $ref: '#/components/schemas/DeleteEventNotification'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateEventNotification'
          delete: '#/components/schemas/DeleteEventNotification'
    # allOf ref to a discriminated anyOf: must not absorb the variant properties
    AuditedAction:
      required:
        - auditId
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
      properties:
        auditId:
          type: string
    # degenerate null-only oneOf next to a discriminated anyOf: the anyOf variants win
    NullableEventNotification:
      oneOf:
        - type: 'null'
      anyOf:
        - $ref: '#/components/schemas/CreateEventNotification'
        - $ref: '#/components/schemas/DeleteEventNotification'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateEventNotification'
          delete: '#/components/schemas/DeleteEventNotification'
