openapi: 3.0.4
info:
  title: Test API
  description: Test API Description
  version: 1.0.0-SNAPSHOT

servers:
  - url: https://jsonplaceholder.typicode.com
    description: JSON Example API
  - url: https://example.com
    description: Example API
  - url: https://mock.httpstatus.io
    description: HTTP Status API

paths:
  /refTest:
    post:
      operationId: refTest
      parameters:
        - $ref: '#/components/parameters/TestParam'
      requestBody:
        $ref: '#/components/requestBodies/TestRequestBody'
      responses:
        200:
          $ref: '#/components/responses/TestResponse'
  /{status}:
    servers:
      - url: https://mock.httpstatus.io
    parameters:
      - in: path
        name: status
        required: true
        schema:
          type: string
      - in: query
        name: count
        schema:
          type: integer
          format: int32
    get:
      operationId: redirectTest
      responses:
        200:
          description: OK
  /photos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
    get:
      operationId: getPhoto
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
  /serialTest:
    get:
      operationId: getSerialTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerialTest'
  /integerTest:
    get:
      operationId: getIntegerTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegerTest'
  /numberTest:
    get:
      operationId: getNumberTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberTest'
  /defaultValue:
    get:
      operationId: defaultValue
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValue'
  /rawResponse:
    get:
      operationId: rawResponse
      responses:
        200:
          description: media type without schema -> raw response, not null
          content:
            application/octet-stream: { }
  /nullableBody:
    post:
      operationId: nullableBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Photo'
              nullable: true
      responses:
        204:
          description: required body with nullable=true -> nullable body parameter
  /listBody:
    post:
      operationId: listBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        200:
          description: OK
  /mapBody:
    post:
      operationId: mapBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
      responses:
        200:
          description: OK
  /hybridBody:
    post:
      operationId: hybridBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ id ]
              properties:
                id:
                  type: integer
              additionalProperties:
                type: string
      responses:
        200:
          description: inline hybrid body and response -> hoisted classes with a bucket property
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                additionalProperties: true
  /hybridList:
    get:
      operationId: hybridList
      responses:
        200:
          description: list of hybrids -> reified list serializer goes through the class serializer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TypedHybrid'
  /freeFormBody:
    post:
      operationId: freeFormBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        200:
          description: free-form body and response -> JsonObject
          content:
            application/json:
              schema:
                additionalProperties: { }
  /multipart:
    servers:
      - url: https://example.com
    post:
      operationId: multipart
      security:
        - BasicAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        200:
          description: OK
  /urlencoded:
    servers:
      - url: https://example.com
    post:
      operationId: urlEncoded
      security:
        - BearerAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
        - OAuth: [ ]
        - OIDCAuth: [ ]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        200:
          description: OK
  /serializedParams/{pathInstant}:
    get:
      operationId: serializedParams
      parameters:
        - in: path
          name: pathInstant
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: queryInstant
          schema:
            type: string
            format: date-time
        - in: query
          name: queryEpochSeconds
          schema:
            type: integer
            format: epoch-seconds
        - in: query
          name: queryBase64
          schema:
            type: string
            format: byte
        - in: query
          name: queryInstantList
          schema:
            type: array
            items:
              type: string
              format: date-time
        - in: header
          name: X-Epoch-Millis
          schema:
            type: integer
            format: epoch-millis
      responses:
        200:
          description: OK
  /instantBody:
    post:
      operationId: instantBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date-time
      responses:
        200:
          description: OK
  /optionalBody:
    post:
      operationId: optionalBody
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        204:
          description: optional body -> nullable parameter, null sends no body
  /optionalInstantBody:
    post:
      operationId: optionalInstantBody
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: string
              format: date-time
      responses:
        204:
          description: optional body with explicit serializer -> nullable parameter, null sends no body
  /epochSecondsResponse:
    get:
      operationId: epochSecondsResponse
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: epoch-seconds
  /instantListResponse:
    get:
      operationId: instantListResponse
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
    APIKeyAuth:
      type: apiKey
      in: query
      name: token
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
    OAuth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.example.com/realms/test/protocol/openid-connect/token
          scopes: { }
        clientCredentials:
          tokenUrl: https://auth.example.com/realms/test/protocol/openid-connect/token
          scopes: { }
    OIDCAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/realms/test/.well-known/openid-configuration
  parameters:
    TestParam:
      name: testParam
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/DateTime'
  requestBodies:
    TestRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
  responses:
    TestResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Photo'
  schemas:
    DateTime:
      type: string
      format: date-time
    NullableAttrTest:
      required: [ attr2, attr4, attr5 ]
      properties:
        attr1:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: false
          description: nullable=false -> not null
        attr2:
          allOf:
            - $ref: '#/components/schemas/Photo'
          description: required -> not null
        attr3:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: nullable=true -> nullable
        attr4:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: required + nullable=true -> nullable
        attr5:
          $ref: '#/components/schemas/NullableInlineObject'
    NullableInlineObject:
      type: object
      nullable: true
      properties:
        value:
          type: string
      description: nullable inline object -> class, nullable at reference sites
    NullableTestAllOfTypealias:
      allOf:
        - $ref: "#/components/schemas/Photo"
      nullable: true
      description: Nullable Photo via allOf
    RefTypealias:
      $ref: "#/components/schemas/Photo"
    Photo:
      type: object
      properties:
        albumId:
          type: integer
          format: int32
        id:
          type: integer
          format: int32
        title:
          type: string
        url:
          type: string
        thumbnailUrl:
          type: string
    SerialTest:
      type: object
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        instant:
          type: string
          format: date-time
        duration:
          type: string
          format: duration
        uuid:
          type: string
          format: uuid
        base64:
          type: string
          format: byte
        epochSeconds:
          type: integer
          format: epoch-seconds
        epochMillis:
          type: integer
          format: epoch-millis
    IntegerTest:
      type: object
      properties:
        unknown:
          type: integer
        int32:
          type: integer
          format: int32
        int64:
          type: integer
          format: int64
        float:
          type: integer
          format: float
        double:
          type: integer
          format: double
    NumberTest:
      type: object
      properties:
        unknown:
          type: number
        float:
          type: number
          format: float
        double:
          type: number
          format: double
        int32:
          type: number
          format: int32
        int64:
          type: number
          format: int64
    DefaultValue:
      type: object
      required:
        - requiredList
        - requiredMap
      properties:
        nullableString:
          type: string
        nullableList:
          type: array
          items:
            type: string
        requiredList:
          type: array
          items:
            type: string
        requiredMap:
          type: object
          additionalProperties:
            type: string
    SealedClassType:
      type: string
      enum:
        - C1
        - C2
    SealedClass1:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass1Child1'
        - $ref: '#/components/schemas/SealedClass1Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass1Child1'
          C2: '#/components/schemas/SealedClass1Child2'
    SealedClass1Child1:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child1Only:
              type: integer
    SealedClass1Child2:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child2Only:
              type: string
    SealedClass2:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass2Child1'
        - $ref: '#/components/schemas/SealedClass2Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass2Child1'
          C2: '#/components/schemas/SealedClass2Child2'
    SealedClass2Child1:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child1Only:
          type: integer
    SealedClass2Child2:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child2Only:
          type: string
    CombinedAnyOf:
      anyOf:
        - $ref: '#/components/schemas/Photo'
        - type: object
          properties:
            combinedExtraAttr:
              type: string
      description: anyOf without discriminator -> object with merged properties
    ExtendedPhoto:
      allOf:
        - $ref: '#/components/schemas/Photo'
      properties:
        extendedAttr:
          type: string
        title:
          description: annotation-only sibling redeclaration -> inherited type is kept
      description: single allOf with sibling properties -> object with merged properties
    ActionResponse:
      type: object
      required:
        - kind
      anyOf:
        - $ref: '#/components/schemas/CreateActionResponse'
        - $ref: '#/components/schemas/UpdateActionResponse'
        - $ref: '#/components/schemas/DeleteActionResponse'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateActionResponse'
          update: '#/components/schemas/UpdateActionResponse'
          delete: '#/components/schemas/DeleteActionResponse'
    CreateActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - create
          type: string
        itemId:
          type: string
    UpdateActionResponse:
      required:
        - kind
        - oldItemId
        - newItemId
      properties:
        kind:
          enum:
            - update
          type: string
        oldItemId:
          type: string
        newItemId:
          type: string
    DeleteActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - delete
          type: string
        itemId:
          type: string
    # variants of EventNotification, deliberately declared before their sealed wrapper:
    # the discriminator property must be stripped regardless of declaration order
    CreateEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - create
          type: string
        eventId:
          type: string
    DeleteEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - delete
          type: string
        eventId:
          type: string
    EventNotification:
      anyOf:
        - $ref: '#/components/schemas/CreateEventNotification'
        - $ref: '#/components/schemas/DeleteEventNotification'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateEventNotification'
          delete: '#/components/schemas/DeleteEventNotification'
    # allOf ref to a discriminated anyOf: must not absorb the variant properties
    AuditedAction:
      required:
        - auditId
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
      properties:
        auditId:
          type: string
    # additionalProperties: standalone maps
    FreeFormMap:
      type: object
      additionalProperties: true
      description: additionalProperties true -> JsonObject typealias
    EmptySchemaMap:
      additionalProperties: { }
      description: empty value schema -> JsonObject typealias
    NullableFreeFormMap:
      additionalProperties:
        type: object
        nullable: true
      description: nullable empty value schema -> JsonObject typealias
    ClosedObject:
      type: object
      properties:
        id:
          type: integer
      additionalProperties: false
      description: additionalProperties false -> plain class without bucket
    # additionalProperties combined with declared properties
    TypedHybrid:
      type: object
      required: [ id ]
      properties:
        id:
          type: integer
        name:
          type: string
      additionalProperties:
        type: string
        format: date-time
      description: typed bucket with a companion serializer for the values
    FreeFormHybrid:
      type: object
      properties:
        id:
          type: integer
      additionalProperties: true
      description: free-form bucket next to declared properties
    NullableValueHybrid:
      type: object
      properties:
        id:
          type: integer
      additionalProperties:
        type: string
        nullable: true
      description: bucket with nullable values
    NestedNameHybrid:
      type: object
      properties:
        additionalProperty:
          type: object
          properties:
            inner:
              type: string
        serializer:
          type: object
          properties:
            inner:
              type: string
      additionalProperties:
        type: object
        properties:
          value:
            type: string
      description: declared nested types occupy the default names of the bucket value type and the serializer object
    InheritedHybrid:
      allOf:
        - $ref: '#/components/schemas/TypedHybrid'
        - type: object
          properties:
            extra:
              type: boolean
      description: bucket inherited through allOf
    OverridingHybrid:
      allOf:
        - $ref: '#/components/schemas/TypedHybrid'
        - type: object
          additionalProperties:
            type: integer
      description: later allOf member overrides the inherited bucket
    ObjectValueHybrid:
      type: object
      properties:
        id:
          type: integer
      additionalProperties:
        type: object
        properties:
          label:
            type: string
          count:
            type: integer
      description: inline object value type -> nested AdditionalProperty class
    CollidingHybrid:
      type: object
      properties:
        id:
          type: integer
        additionalProperties:
          type: string
      additionalProperties:
        type: string
      description: declared property occupies the default bucket name
    HybridUnion:
      oneOf:
        - $ref: '#/components/schemas/HybridUnionA'
        - $ref: '#/components/schemas/HybridUnionB'
      discriminator:
        propertyName: kind
        mapping:
          a: '#/components/schemas/HybridUnionA'
          b: '#/components/schemas/HybridUnionB'
      description: discriminated oneOf whose variants are hybrids
    HybridUnionA:
      type: object
      properties:
        kind:
          type: string
        aValue:
          type: string
      additionalProperties:
        type: string
    HybridUnionB:
      type: object
      properties:
        kind:
          type: string
        bValue:
          type: integer
      additionalProperties: true
    UntaggedHybridUnion:
      oneOf:
        - $ref: '#/components/schemas/UntaggedHybridA'
        - $ref: '#/components/schemas/UntaggedHybridB'
      description: oneOf without discriminator whose variants are hybrids
    UntaggedHybridA:
      type: object
      properties:
        aValue:
          type: string
      additionalProperties:
        type: string
    UntaggedHybridB:
      type: object
      properties:
        bValue:
          type: integer
      additionalProperties: true
    # a declared property named like the default discriminator must survive the sealed registration
    TypedThing:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
    # additionalProperties: nested, inherited and closed shapes
    HybridOwner:
      type: object
      properties:
        inline:
          type: object
          properties:
            id:
              type: integer
          additionalProperties:
            type: string
      description: inline hybrid property -> nested class with its own serializer object
    StringMap:
      type: object
      additionalProperties:
        type: string
      description: typed map referenced by the bucket-only fixtures
    BucketOnly:
      allOf:
        - $ref: '#/components/schemas/FreeFormMap'
        - $ref: '#/components/schemas/StringMap'
      description: allOf of two maps -> data class with only a bucket, later member wins
    MapWithSiblings:
      allOf:
        - $ref: '#/components/schemas/StringMap'
      properties:
        id:
          type: integer
      description: map ref with sibling properties -> hybrid
    ClosedEmpty:
      type: object
      additionalProperties: false
      description: additionalProperties false without properties -> JsonElement
    ClosedAlias:
      allOf:
        - $ref: '#/components/schemas/ClosedObject'
      additionalProperties: false
      description: additionalProperties false next to a single ref -> typealias
    NestedHybrid:
      type: object
      properties:
        id:
          type: integer
      additionalProperties:
        $ref: '#/components/schemas/FreeFormHybrid'
      description: hybrid values inside a bucket
    MapProperties:
      type: object
      properties:
        meta:
          additionalProperties: true
        photos:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Photo'
      description: free-form and typed map properties
    SealedHybridBase:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedHybridChild1'
        - $ref: '#/components/schemas/SealedHybridChild2'
      properties:
        kind:
          type: string
      additionalProperties:
        type: string
      discriminator:
        propertyName: kind
        mapping:
          one: '#/components/schemas/SealedHybridChild1'
          two: '#/components/schemas/SealedHybridChild2'
      description: sealed schema with an additionalProperties sibling -> variants inherit the bucket
    SealedHybridChild1:
      allOf:
        - $ref: '#/components/schemas/SealedHybridBase'
        - type: object
          properties:
            one:
              type: integer
    SealedHybridChild2:
      allOf:
        - $ref: '#/components/schemas/SealedHybridBase'
        - type: object
          properties:
            two:
              type: string
          additionalProperties: true
