openapi: 3.0.4
info:
  title: Test API
  description: Test API Description
  version: 1.0.0-SNAPSHOT

servers:
  - url: https://jsonplaceholder.typicode.com
    description: JSON Example API
  - url: https://example.com
    description: Example API
  - url: https://mock.httpstatus.io
    description: HTTP Status API

paths:
  /refTest:
    post:
      operationId: refTest
      parameters:
        - $ref: '#/components/parameters/TestParam'
      requestBody:
        $ref: '#/components/requestBodies/TestRequestBody'
      responses:
        200:
          $ref: '#/components/responses/TestResponse'
  /{status}:
    servers:
      - url: https://mock.httpstatus.io
    parameters:
      - in: path
        name: status
        required: true
        schema:
          type: string
      - in: query
        name: count
        schema:
          type: integer
          format: int32
    get:
      operationId: redirectTest
      responses:
        200:
          description: OK
  /photos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
    get:
      operationId: getPhoto
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
  /serialTest:
    get:
      operationId: getSerialTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerialTest'
  /integerTest:
    get:
      operationId: getIntegerTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegerTest'
  /numberTest:
    get:
      operationId: getNumberTest
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberTest'
  /defaultValue:
    get:
      operationId: defaultValue
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultValue'
  /rawResponse:
    get:
      operationId: rawResponse
      responses:
        200:
          description: media type without schema -> raw response, not null
          content:
            application/octet-stream: { }
  /nullableBody:
    post:
      operationId: nullableBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Photo'
              nullable: true
      responses:
        204:
          description: required body with nullable=true -> nullable body parameter
  /listBody:
    post:
      operationId: listBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        200:
          description: OK
  /mapBody:
    post:
      operationId: mapBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
      responses:
        200:
          description: OK
  /multipart:
    servers:
      - url: https://example.com
    post:
      operationId: multipart
      security:
        - BasicAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        200:
          description: OK
  /urlencoded:
    servers:
      - url: https://example.com
    post:
      operationId: urlEncoded
      security:
        - BearerAuth: [ ]
        - TokenAuth: [ ]
        - APIKeyAuth: [ ]
        - OAuth: [ ]
        - OIDCAuth: [ ]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        200:
          description: OK
  /serializedParams/{pathInstant}:
    get:
      operationId: serializedParams
      parameters:
        - in: path
          name: pathInstant
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: queryInstant
          schema:
            type: string
            format: date-time
        - in: query
          name: queryEpochSeconds
          schema:
            type: integer
            format: epoch-seconds
        - in: query
          name: queryBase64
          schema:
            type: string
            format: byte
        - in: query
          name: queryInstantList
          schema:
            type: array
            items:
              type: string
              format: date-time
        - in: header
          name: X-Epoch-Millis
          schema:
            type: integer
            format: epoch-millis
      responses:
        200:
          description: OK
  /instantBody:
    post:
      operationId: instantBody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date-time
      responses:
        200:
          description: OK
  /epochSecondsResponse:
    get:
      operationId: epochSecondsResponse
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: epoch-seconds
  /instantListResponse:
    get:
      operationId: instantListResponse
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date-time
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: token
    APIKeyAuth:
      type: apiKey
      in: query
      name: token
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
    OAuth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.example.com/realms/test/protocol/openid-connect/token
          scopes: { }
        clientCredentials:
          tokenUrl: https://auth.example.com/realms/test/protocol/openid-connect/token
          scopes: { }
    OIDCAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/realms/test/.well-known/openid-configuration
  parameters:
    TestParam:
      name: testParam
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/DateTime'
  requestBodies:
    TestRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
  responses:
    TestResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Photo'
  schemas:
    DateTime:
      type: string
      format: date-time
    NullableAttrTest:
      required: [ attr2, attr4, attr5 ]
      properties:
        attr1:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: false
          description: nullable=false -> not null
        attr2:
          allOf:
            - $ref: '#/components/schemas/Photo'
          description: required -> not null
        attr3:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: nullable=true -> nullable
        attr4:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: required + nullable=true -> nullable
        attr5:
          $ref: '#/components/schemas/NullableInlineObject'
    NullableInlineObject:
      type: object
      nullable: true
      properties:
        value:
          type: string
      description: nullable inline object -> class, nullable at reference sites
    NullableTestAllOfTypealias:
      allOf:
        - $ref: "#/components/schemas/Photo"
      nullable: true
      description: Nullable Photo via allOf
    RefTypealias:
      $ref: "#/components/schemas/Photo"
    Photo:
      type: object
      properties:
        albumId:
          type: integer
          format: int32
        id:
          type: integer
          format: int32
        title:
          type: string
        url:
          type: string
        thumbnailUrl:
          type: string
    SerialTest:
      type: object
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        instant:
          type: string
          format: date-time
        duration:
          type: string
          format: duration
        uuid:
          type: string
          format: uuid
        base64:
          type: string
          format: byte
        epochSeconds:
          type: integer
          format: epoch-seconds
        epochMillis:
          type: integer
          format: epoch-millis
    IntegerTest:
      type: object
      properties:
        unknown:
          type: integer
        int32:
          type: integer
          format: int32
        int64:
          type: integer
          format: int64
        float:
          type: integer
          format: float
        double:
          type: integer
          format: double
    NumberTest:
      type: object
      properties:
        unknown:
          type: number
        float:
          type: number
          format: float
        double:
          type: number
          format: double
        int32:
          type: number
          format: int32
        int64:
          type: number
          format: int64
    DefaultValue:
      type: object
      required:
        - requiredList
        - requiredMap
      properties:
        nullableString:
          type: string
        nullableList:
          type: array
          items:
            type: string
        requiredList:
          type: array
          items:
            type: string
        requiredMap:
          type: object
          additionalProperties:
            type: string
    SealedClassType:
      type: string
      enum:
        - C1
        - C2
    SealedClass1:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass1Child1'
        - $ref: '#/components/schemas/SealedClass1Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass1Child1'
          C2: '#/components/schemas/SealedClass1Child2'
    SealedClass1Child1:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child1Only:
              type: integer
    SealedClass1Child2:
      allOf:
        - $ref: '#/components/schemas/SealedClass1'
        - type: object
          properties:
            child2Only:
              type: string
    SealedClass2:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SealedClass2Child1'
        - $ref: '#/components/schemas/SealedClass2Child2'
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
      discriminator:
        propertyName: '#discriminator'
        mapping:
          C1: '#/components/schemas/SealedClass2Child1'
          C2: '#/components/schemas/SealedClass2Child2'
    SealedClass2Child1:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child1Only:
          type: integer
    SealedClass2Child2:
      type: object
      properties:
        '#discriminator':
          $ref: '#/components/schemas/SealedClassType'
        commonAttr:
          type: string
        child2Only:
          type: string
    CombinedAnyOf:
      anyOf:
        - $ref: '#/components/schemas/Photo'
        - type: object
          properties:
            combinedExtraAttr:
              type: string
      description: anyOf without discriminator -> object with merged properties
    ExtendedPhoto:
      allOf:
        - $ref: '#/components/schemas/Photo'
      properties:
        extendedAttr:
          type: string
        title:
          description: annotation-only sibling redeclaration -> inherited type is kept
      description: single allOf with sibling properties -> object with merged properties
    ActionResponse:
      type: object
      required:
        - kind
      anyOf:
        - $ref: '#/components/schemas/CreateActionResponse'
        - $ref: '#/components/schemas/UpdateActionResponse'
        - $ref: '#/components/schemas/DeleteActionResponse'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateActionResponse'
          update: '#/components/schemas/UpdateActionResponse'
          delete: '#/components/schemas/DeleteActionResponse'
    CreateActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - create
          type: string
        itemId:
          type: string
    UpdateActionResponse:
      required:
        - kind
        - oldItemId
        - newItemId
      properties:
        kind:
          enum:
            - update
          type: string
        oldItemId:
          type: string
        newItemId:
          type: string
    DeleteActionResponse:
      required:
        - kind
        - itemId
      properties:
        kind:
          enum:
            - delete
          type: string
        itemId:
          type: string
    # variants of EventNotification, deliberately declared before their sealed wrapper:
    # the discriminator property must be stripped regardless of declaration order
    CreateEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - create
          type: string
        eventId:
          type: string
    DeleteEventNotification:
      required:
        - kind
        - eventId
      properties:
        kind:
          enum:
            - delete
          type: string
        eventId:
          type: string
    EventNotification:
      anyOf:
        - $ref: '#/components/schemas/CreateEventNotification'
        - $ref: '#/components/schemas/DeleteEventNotification'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateEventNotification'
          delete: '#/components/schemas/DeleteEventNotification'
    # allOf ref to a discriminated anyOf: must not absorb the variant properties
    AuditedAction:
      required:
        - auditId
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
      properties:
        auditId:
          type: string
